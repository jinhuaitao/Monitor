name: Build and Release Monitor

on:
  push:
    branches: [ main, master ]
    paths:
      - '**/*.go'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/build.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - '**/*.go'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/build.yml'
  workflow_dispatch:

# 同一分支上的多次运行排队而不是并发，避免两次 release 同时写同一个 latest 标签。
# 刻意不开 cancel-in-progress：发布流程被中途掐断会留下半截的 Release。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

# 默认最小权限：只有真正要写 Release 的 job 才单独提权。
# 这样即使构建步骤里被塞进恶意代码，也改不了仓库内容。
permissions:
  contents: read

env:
  # Go 工具链版本的唯一来源。构建与校验必须用同一个版本，
  # 否则会出现「本地/CI 都能过、换个 job 就挂」这种最难查的差异。
  GO_VERSION: '1.27'

jobs:
  # 统一计算版本号，供编译注入与发布使用
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.ver.outputs.version }}
      commit: ${{ steps.ver.outputs.commit }}
      build_time: ${{ steps.ver.outputs.build_time }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute version
        id: ver
        run: |
          set -e
          COMMIT="$(git rev-parse --short HEAD)"
          VERSION="$(date -u +'%Y.%m.%d')-${COMMIT}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"
          echo "build_time=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $VERSION"

  # 静态检查。放在编译之前，让「格式 / 静态检查 / 编译」失败时直接不产出
  # 任何二进制 —— 总比发布一个坏版本再回滚便宜。
  verify:
    name: Verify (fmt / vet / build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Check formatting
        run: |
          set -e
          unformatted="$(gofmt -l . | grep -v '^$' || true)"
          if [ -n "$unformatted" ]; then
            echo "::error::以下文件未通过 gofmt，请本地执行 gofmt -w . 后重新提交："
            echo "$unformatted"
            exit 1
          fi
          echo "✓ gofmt 检查通过"

      # -mod=readonly：go.sum 缺项时直接失败，而不是在 CI 里悄悄改写依赖文件后「假装成功」
      - name: go vet
        run: go vet -mod=readonly ./...

      # 编译一次做快速门禁：让编译错误在最快的 job 上就暴露，
      # 而不是等到后面跑完多架构矩阵才发现
      - name: Compile check
        env:
          CGO_ENABLED: '0'
        run: go build -mod=readonly -o /dev/null .

  build:
    name: linux-${{ matrix.goarch }}
    needs: [ version, verify ]
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        goarch: [ amd64, arm64 ]

    env:
      GOOS: linux
      GOARCH: ${{ matrix.goarch }}
      # 关键：依赖链已全部为纯 Go（SQLite 改用 glebarez/sqlite），
      # 关闭 CGO 即可产出【静态二进制】，同时兼容 Alpine(musl) 与 Debian/CentOS(glibc)。
      # 早前 CGO_ENABLED=1 用 Ubuntu gcc 编出的是 glibc 动态链接二进制，
      # 在 Alpine 上会因缺少 /lib64/ld-linux-x86-64.so.2 直接 crashed。
      CGO_ENABLED: '0'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Show toolchain
        run: |
          go version
          go env GOOS GOARCH CGO_ENABLED

      - name: Build
        env:
          VERSION: ${{ needs.version.outputs.version }}
          COMMIT: ${{ needs.version.outputs.commit }}
          BUILD_TIME: ${{ needs.version.outputs.build_time }}
        run: |
          set -e
          mkdir -p dist
          go build -trimpath -mod=readonly \
            -ldflags "-s -w -X main.BuildVersion=${VERSION} -X main.BuildCommit=${COMMIT} -X main.BuildTime=${BUILD_TIME}" \
            -o "dist/monitor-linux-${{ matrix.goarch }}" .
          file "dist/monitor-linux-${{ matrix.goarch }}"

      # 防回归：一旦有人重新打开 CGO，Alpine 用户会立刻遇到启动崩溃
      - name: Verify static linking
        run: |
          set -e
          BIN="dist/monitor-linux-${{ matrix.goarch }}"
          if readelf -l "$BIN" | grep -q "INTERP"; then
            echo "::error file=$BIN::$BIN 是动态链接二进制，在 Alpine(musl) 上无法启动。请保持 CGO_ENABLED=0。"
            exit 1
          fi
          if strings -a "$BIN" | grep -q "^GLIBC_"; then
            echo "::error file=$BIN::$BIN 仍引用 GLIBC 符号，构建环境可能误开了 CGO。"
            exit 1
          fi
          echo "✓ 静态链接校验通过：$BIN 可运行于 musl 与 glibc 发行版"

      # 冒烟测试：二进制至少要能启动并自报版本。
      # 编译成功不等于能跑 —— 版本注入写错、init 里 panic 这类问题只有真跑一次才暴露。
      - name: Smoke test
        run: |
          set -e
          BIN="dist/monitor-linux-${{ matrix.goarch }}"
          out="$("$BIN" -mode version)"
          echo "$out"
          echo "$out" | grep -q "${{ needs.version.outputs.version }}" \
            || { echo "::error::二进制自报版本与注入的版本不一致"; exit 1; }
          # 未知模式必须以非零码退出，而不是被当成 server 静默启动
          if "$BIN" -mode definitely-not-a-mode >/dev/null 2>&1; then
            echo "::error::未知 -mode 应报错退出"
            exit 1
          fi

      - name: Checksum
        run: |
          cd dist
          sha256sum "monitor-linux-${{ matrix.goarch }}" > "monitor-linux-${{ matrix.goarch }}.sha256"
          cat "monitor-linux-${{ matrix.goarch }}.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: monitor-linux-${{ matrix.goarch }}
          path: |
            dist/monitor-linux-${{ matrix.goarch }}
            dist/monitor-linux-${{ matrix.goarch }}.sha256

  # 独立发布 Job，等待 build 全部完成后统一打包上传，避免并发冲突
  release:
    needs: [ version, build ]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    # 只有这个 job 需要写权限
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-all

      - name: Display downloaded files
        run: ls -R dist-all

      # 写入 VERSION 文件：面板在线更新时据此精确比对版本
      - name: Write VERSION file
        env:
          VERSION: ${{ needs.version.outputs.version }}
          COMMIT: ${{ needs.version.outputs.commit }}
          BUILD_TIME: ${{ needs.version.outputs.build_time }}
        run: |
          set -e
          printf '%s\n' "$VERSION" > dist-all/VERSION
          cat dist-all/VERSION
          {
            echo "version=$VERSION"
            echo "commit=$COMMIT"
            echo "build_time=$BUILD_TIME"
          } > dist-all/build-info.txt
          cat dist-all/build-info.txt

      - name: Publish to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Latest Release"
          body: |
            自动构建的最新版本（随每次 main 分支提交更新）

            版本号：`${{ needs.version.outputs.version }}`
            提交：`${{ needs.version.outputs.commit }}`
            构建时间：`${{ needs.version.outputs.build_time }}`

            本版本为**静态编译**（CGO_ENABLED=0），Alpine(musl) 与 Debian/CentOS(glibc) 通用。

            可在面板「系统管理 → 版本更新」中一键升级面板与客户端。
          prerelease: false
          files: |
            dist-all/monitor-linux-amd64/monitor-linux-amd64
            dist-all/monitor-linux-amd64/monitor-linux-amd64.sha256
            dist-all/monitor-linux-arm64/monitor-linux-arm64
            dist-all/monitor-linux-arm64/monitor-linux-arm64.sha256
            dist-all/VERSION
            dist-all/build-info.txt
