name: Build and Release Multi-Arch Monitor

on:
  push:
    branches: [ main, master ]
    # 也可以改成通过打 Git Tag 触发（例如推送 v1.0.0 时触发发布）：
    # tags:
    #   - 'v*'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 必须：赋予写入 Releases 的权限

    steps:
    # 1. 检出代码
    - name: Checkout code
      uses: actions/checkout@v4

    # 2. 设置 Go 环境
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.22'

    # 3. 自动寻找 main.go 并进行多架构交叉编译
    - name: Multi-Arch Build
      run: |
        echo "=== 寻找 main.go 的精确路径 ==="
        MAIN_PATH=$(find . -name "main.go" -print -quit)
        
        if [ -z "$MAIN_PATH" ]; then
          echo "Error: 未找到 main.go 文件！"
          exit 1
        pxi
        fi
        
        TARGET_DIR=$(dirname "$MAIN_PATH")
        echo "进入目录: $TARGET_DIR"
        cd "$TARGET_DIR"
        
        # 整理依赖
        go mod tidy
        
        # 创建统一存放编译产物的目录
        mkdir -p ../../output
        
        # 定义需要编译的目标平台和架构组合
        # 格式: "输出文件名后缀:GOOS:GOARCH"
        PLATFORMS=(
          "linux-amd64:linux:amd64"
          "linux-arm64:linux:arm64"
          "linux-armv7:linux:arm"
        )
        
        for platform in "${PLATFORMS[@]}"; do
          IFS=":" read -r name os arch <<< "$platform"
          output_name="monitor-app-$name"
          
          echo "正在编译 -> OS: $os, ARCH: $arch"
          
          # 执行交叉编译
          GOOS=$os GOARCH=$arch go build -v -o "$output_name" main.go
          
          # 移动到根目录的 output 文件夹
          mv "$output_name" ../../output/
        done
        
        echo "=== 编译完成，产物列表 ==="
        ls -la ../../output/

    # 4. 自动创建 Release 并上传所有架构的二进制文件
    - name: Release to GitHub
      uses: softprops/action-gh-release@v2
      with:
        files: output/monitor-*
        tag_name: v1.0.${{ github.run_number }}
        name: "Monitor Service v1.0.${{ github.run_number }} (Multi-Arch)"
        body: |
          自动编译的多架构 Linux 版本：
          - `monitor-app-linux-amd64` (适用于常规 Intel/AMD x86_64 服务器、VPS)
          - `monitor-app-linux-arm64` (适用于 64位 ARM 服务器、树莓派 4/5 64位系统)
          - `monitor-app-linux-armv7` (适用于 32位 ARM 设备、树莓派 2/3 旧系统)
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
