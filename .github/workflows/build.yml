name: Build and Release Monitor

on:
  push:
    branches: [ main, master ]
    # 也可以通过打 Tag 触发（推荐）：
    # tags:
    #   - 'v*'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 赋予发布 Release 的权限

    steps:
    # 1. 检出代码
    - name: Checkout code
      uses: actions/checkout@v4

    # 2. 设置 Go 环境
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.22'

    # 3. 自动寻找 main.go 所在目录并编译
    - name: Find and Build
      run: |
        echo "=== 寻找 main.go 的精确路径 ==="
        MAIN_PATH=$(find . -name "main.go" -print -quit)
        
        if [ -z "$MAIN_PATH" ]; then
          echo "Error: 未找到 main.go 文件！"
          exit 1
        fi
        
        echo "找到 main.go 位于: $MAIN_PATH"
        TARGET_DIR=$(dirname "$MAIN_PATH")
        
        cd "$TARGET_DIR"
        go mod tidy
        # 可以根据需要交叉编译不同平台的版本，这里默认编译当前 Linux x86_64
        go build -v -o monitor-app main.go
        
        # 移动到根目录准备打包
        mkdir -p ../../output
        mv monitor-app ../../output/monitor-app

    # 4. 自动创建 Release 并上传二进制文件
    - name: Release to GitHub
      uses: softprops/action-gh-release@v2
      with:
        files: output/monitor-app
        # 如果你想用固定的标签名覆盖发布，或者每次用时间戳
        tag_name: v1.0.${{ github.run_number }}
        name: "Monitor Service v1.0.${{ github.run_number }}"
        body: "自动编译发布的 Monitor 服务二进制文件。"
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
