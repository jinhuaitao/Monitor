name: Build and Release Monitor

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

env:
  # 发布构建使用的 Go 版本。刻意写死而不是用 stable：
  # 用 stable 会让「昨天和今天同一份提交」编出不同的二进制，
  # 出问题时无法复现。安全补丁通过定期手动升这个值来吸收。
  GO_VERSION: '1.27'

jobs:
  # ================= 质量门禁 =================
  #
  # 原工作流只做「编译 + 发布」，没有任何检查：格式化漂移、vet 报告的
  # 问题、测试失败、依赖漏洞都拦不住，全靠人肉 review。这里补上。
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 用 go.mod 里声明的最低版本做验证：CI 用最新版编译时，很容易
      # 不知不觉用上高于最低版本的语言特性，而用户按 README 装的老
      # 工具链会直接编译失败。
      - name: Setup Go (go.mod version)
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      # go.mod / go.sum 漂移检查：源码里引用了未声明的依赖时，
      # 本地因为有缓存能编过，CI 从零开始就会失败。
      - name: Check go.mod is tidy
        run: |
          set -e
          go mod tidy
          if ! git diff --quiet -- go.mod go.sum; then
            echo "::error::go.mod / go.sum 与源码不一致，请在本地执行 go mod tidy 后提交"
            git diff -- go.mod go.sum
            exit 1
          fi

      - name: gofmt
        run: |
          set -e
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then
            echo "::error::以下文件未格式化，请执行 gofmt -w ."
            echo "$out"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      # 带竞态检测：面板里有若干共享状态（statusCache / globalConfig /
      # alertStates / loginGuard），锁写错时普通测试是绿的，只有 -race 能抓到。
      - name: go test
        run: go test -count=1 -race ./...

  # 依赖漏洞扫描独立成一个 job：它依赖上游漏洞库，可能因为新披露的公告
  # 而在「没有改任何代码」的情况下变红。独立出来便于一眼区分
  #「这次改动有问题」和「上游又报了一个洞」。
  #
  # continue-on-error 是刻意的：新披露的公告不应阻断无关的开发。
  # 结果在 job 列表里可见，需要时再单独升级依赖。
  vulncheck:
    name: Vulnerability scan
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  # 统一计算版本号，供编译注入与发布使用
  version:
    name: Resolve version
    needs: [ verify ]
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      commit: ${{ steps.ver.outputs.commit }}
      build_time: ${{ steps.ver.outputs.build_time }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute version
        id: ver
        run: |
          set -e
          COMMIT="$(git rev-parse --short HEAD)"
          VERSION="$(date -u +'%Y.%m.%d')-${COMMIT}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"
          echo "build_time=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $VERSION"

  build:
    name: linux-${{ matrix.goarch }}
    needs: version
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        goarch: [ amd64, arm64 ]

    env:
      GOOS: linux
      GOARCH: ${{ matrix.goarch }}
      # 关键：依赖链已全部为纯 Go（SQLite 改用 glebarez/sqlite），
      # 关闭 CGO 即可产出【静态二进制】，同时兼容 Alpine(musl) 与 Debian/CentOS(glibc)。
      # 早前 CGO_ENABLED=1 用 Ubuntu gcc 编出的是 glibc 动态链接二进制，
      # 在 Alpine 上会因缺少 /lib64/ld-linux-x86-64.so.2 直接 crashed。
      CGO_ENABLED: '0'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Show toolchain
        run: |
          go version
          go env GOOS GOARCH CGO_ENABLED

      - name: Build
        env:
          VERSION: ${{ needs.version.outputs.version }}
          COMMIT: ${{ needs.version.outputs.commit }}
          BUILD_TIME: ${{ needs.version.outputs.build_time }}
        run: |
          set -e
          mkdir -p dist
          go build -trimpath \
            -ldflags "-s -w -X main.BuildVersion=${VERSION} -X main.BuildCommit=${COMMIT} -X main.BuildTime=${BUILD_TIME}" \
            -o "dist/monitor-linux-${{ matrix.goarch }}" .
          file "dist/monitor-linux-${{ matrix.goarch }}"

      # 防回归：一旦有人重新打开 CGO，Alpine 用户会立刻遇到启动崩溃
      - name: Verify static linking
        run: |
          set -e
          BIN="dist/monitor-linux-${{ matrix.goarch }}"
          if readelf -l "$BIN" | grep -q "INTERP"; then
            echo "::error file=$BIN::$BIN 是动态链接二进制，在 Alpine(musl) 上无法启动。请保持 CGO_ENABLED=0。"
            exit 1
          fi
          if strings -a "$BIN" | grep -q "^GLIBC_"; then
            echo "::error file=$BIN::$BIN 仍引用 GLIBC 符号，构建环境可能误开了 CGO。"
            exit 1
          fi
          echo "✓ 静态链接校验通过：$BIN 可运行于 musl 与 glibc 发行版"

      # 防回归：产物必须是目标架构的 ELF。
      # 面板会把这份文件分发给所有节点并让它们替换自身重启，
      # 一个架构不对的二进制等于让全部节点同时起不来 —— 而 sha256
      # 挡不住这类问题（坏源配坏哈希，永远对得上）。
      - name: Verify binary architecture
        run: |
          set -e
          BIN="dist/monitor-linux-${{ matrix.goarch }}"
          MACHINE="$(readelf -h "$BIN" | awk -F: '/Machine/{print $2}' | xargs)"
          case "${{ matrix.goarch }}" in
            amd64) WANT="X86-64" ;;
            arm64) WANT="AArch64" ;;
          esac
          case "$MACHINE" in
            *"$WANT"*) echo "✓ 架构校验通过：$MACHINE" ;;
            *) echo "::error file=$BIN::架构不匹配，期望 $WANT，实际 $MACHINE"; exit 1 ;;
          esac

      - name: Checksum
        run: |
          cd dist
          sha256sum "monitor-linux-${{ matrix.goarch }}" > "monitor-linux-${{ matrix.goarch }}.sha256"
          cat "monitor-linux-${{ matrix.goarch }}.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: monitor-linux-${{ matrix.goarch }}
          path: |
            dist/monitor-linux-${{ matrix.goarch }}
            dist/monitor-linux-${{ matrix.goarch }}.sha256

  # 独立发布 Job，等待 build 全部完成后统一打包上传，避免并发冲突
  release:
    needs: [ version, build ]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-all

      - name: Display downloaded files
        run: ls -R dist-all

      # 写入 VERSION 文件：面板在线更新时据此精确比对版本
      - name: Write VERSION file
        env:
          VERSION: ${{ needs.version.outputs.version }}
          COMMIT: ${{ needs.version.outputs.commit }}
          BUILD_TIME: ${{ needs.version.outputs.build_time }}
        run: |
          set -e
          printf '%s\n' "$VERSION" > dist-all/VERSION
          cat dist-all/VERSION
          {
            echo "version=$VERSION"
            echo "commit=$COMMIT"
            echo "build_time=$BUILD_TIME"
          } > dist-all/build-info.txt
          cat dist-all/build-info.txt

      - name: Publish to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Latest Release"
          body: |
            自动构建的最新版本（随每次 main 分支提交更新）

            版本号：`${{ needs.version.outputs.version }}`
            提交：`${{ needs.version.outputs.commit }}`
            构建时间：`${{ needs.version.outputs.build_time }}`

            本版本为**静态编译**（CGO_ENABLED=0），Alpine(musl) 与 Debian/CentOS(glibc) 通用。

            可在面板「系统管理 → 版本更新」中一键升级面板与客户端。
          prerelease: false
          files: |
            dist-all/monitor-linux-amd64/monitor-linux-amd64
            dist-all/monitor-linux-amd64/monitor-linux-amd64.sha256
            dist-all/monitor-linux-arm64/monitor-linux-arm64
            dist-all/monitor-linux-arm64/monitor-linux-arm64.sha256
            dist-all/VERSION
            dist-all/build-info.txt
