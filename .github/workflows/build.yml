name: Build Monitor (amd64 / arm64)

on:
  push:
    branches: [ main, master ]
    tags: [ "v*" ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: linux-${{ matrix.goarch }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          # x86_64：runner 自带的 gcc，原生编译[cite: 1]
          - goarch: amd64
            use_zig: false
          # ARM64：用 zig 当 C 交叉编译器（不再依赖 apt 的 gcc-aarch64-linux-gnu）[cite: 1]
          - goarch: arm64
            use_zig: true

    env:
      GOOS: linux
      GOARCH: ${{ matrix.goarch }}
      CGO_ENABLED: '1'   # gorm.io/driver/sqlite (mattn/go-sqlite3) 必须开 CGO[cite: 1]
      CC: ${{ matrix.use_zig && 'zig cc -target aarch64-linux-gnu' || 'gcc' }}[cite: 1]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          # gin v1.12 要求 Go >= 1.25[cite: 1]
          go-version: '1.27'
          cache: true

      # sqlite 驱动是 C 实现，交叉编译 arm64 必须有一个能产出 aarch64 代码的 C 编译器。[cite: 1]
      # zig 自带各 target 的 libc/头文件，装完即可当交叉编译器用，[cite: 1]
      # 不受 apt 源波动影响（原 apt install gcc-aarch64-linux-gnu 方案易在 update 阶段失败）。[cite: 1]
      - name: Setup zig (cross C compiler)
        if: matrix.use_zig
        run: |
          set -e
          ZIG_VERSION=0.15.2
          mkdir -p "$HOME/.zig"
          curl -fsSL -o /tmp/zig.tar.xz \
            "https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-linux-${ZIG_VERSION}.tar.xz"
          tar -C "$HOME/.zig" --strip-components=1 -xf /tmp/zig.tar.xz
          echo "$HOME/.zig" >> "$GITHUB_PATH"
          "$HOME/.zig/zig" version

      - name: Download dependencies
        run: go mod download

      - name: Show toolchain
        run: |
          go version
          go env GOOS GOARCH CGO_ENABLED CC
          command -v "${CC%% *}" || true

      - name: Build
        run: |
          set -e
          mkdir -p dist
          go build -trimpath -ldflags "-s -w" -o "dist/monitor-linux-${{ matrix.goarch }}" .
          file "dist/monitor-linux-${{ matrix.goarch }}"

      - name: Checksum
        run: |
          cd dist
          sha256sum "monitor-linux-${{ matrix.goarch }}" > "monitor-linux-${{ matrix.goarch }}.sha256"
          cat "monitor-linux-${{ matrix.goarch }}.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: monitor-linux-${{ matrix.goarch }}
          path: |
            dist/monitor-linux-${{ matrix.goarch }}
            dist/monitor-linux-${{ matrix.goarch }}.sha256

      - name: Publish to Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/monitor-linux-${{ matrix.goarch }}
            dist/monitor-linux-${{ matrix.goarch }}.sha256
          generate_release_notes: true
