name: Build Go Monitor

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    # 1. 检出代码
    - name: Checkout code
      uses: actions/checkout@v4

    # 2. 设置 Go 环境
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.22'

    # 3. 自动寻找 main.go 所在目录并编译，避免路径报错
    - name: Find and Build
      run: |
        echo "=== 打印当前目录结构，方便调试 ==="
        pwd
        ls -la
        
        echo "=== 寻找 main.go 的精确路径 ==="
        MAIN_PATH=$(find . -name "main.go" -print -quit)
        
        if [ -z "$MAIN_PATH" ]; then
          echo "Error: 未找到 main.go 文件！"
          exit 1
        fi
        
        echo "找到 main.go 位于: $MAIN_PATH"
        
        # 获取 main.go 所在的文件夹目录
        TARGET_DIR=$(dirname "$MAIN_PATH")
        echo "进入目录: $TARGET_DIR 并开始编译..."
        
        cd "$TARGET_DIR"
        go mod tidy
        go build -v -o monitor-app main.go
        
        # 将编译好的文件移动到临时统一存放目录
        mkdir -p ../../output
        mv monitor-app ../../output/monitor-app

    # 4. 保存编译好的二进制文件到 Artifacts
    - name: Upload compiled binary
      uses: actions/upload-artifact@v4
      with:
        name: monitor-binary
        path: output/monitor-app
