name: Build and Release Monitor

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: linux-${{ matrix.goarch }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - goarch: amd64
            use_zig: false
          - goarch: arm64
            use_zig: true

    env:
      GOOS: linux
      GOARCH: ${{ matrix.goarch }}
      CGO_ENABLED: '1'
      CC: "${{ matrix.use_zig && 'zig cc -target aarch64-linux-gnu' || 'gcc' }}"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: true

      - name: Setup zig (cross C compiler)
        if: matrix.use_zig
        run: |
          set -e
          ZIG_VERSION=0.15.2
          mkdir -p "$HOME/.zig"
          curl -fsSL -o /tmp/zig.tar.xz \
            "https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-linux-${ZIG_VERSION}.tar.xz"
          tar -C "$HOME/.zig" --strip-components=1 -xf /tmp/zig.tar.xz
          echo "$HOME/.zig" >> "$GITHUB_PATH"
          "$HOME/.zig/zig" version

      - name: Download dependencies
        run: go mod download

      - name: Show toolchain
        run: |
          go version
          go env GOOS GOARCH CGO_ENABLED CC
          command -v "${CC%% *}" || true

      - name: Build
        run: |
          set -e
          mkdir -p dist
          go build -trimpath -ldflags "-s -w" -o "dist/monitor-linux-${{ matrix.goarch }}" .
          file "dist/monitor-linux-${{ matrix.goarch }}"

      - name: Checksum
        run: |
          cd dist
          sha256sum "monitor-linux-${{ matrix.goarch }}" > "monitor-linux-${{ matrix.goarch }}.sha256"
          cat "monitor-linux-${{ matrix.goarch }}.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: monitor-linux-${{ matrix.goarch }}
          path: |
            dist/monitor-linux-${{ matrix.goarch }}
            dist/monitor-linux-${{ matrix.goarch }}.sha256

  # 新增一个独立的发布 Job，等待 build 全部完成后统一打包上传，避免并发冲突
  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-all

      - name: Display downloaded files
        run: ls -R dist-all

      - name: Publish to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Latest Release"
          body: "自动构建的最新版本（随每次 main 分支提交更新）"
          prerelease: false
          files: |
            dist-all/monitor-linux-amd64/monitor-linux-amd64
            dist-all/monitor-linux-arm64/monitor-linux-arm64
