name: Build Go Monitor

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    # 1. 检出代码
    - name: Checkout code
      uses: actions/checkout@v4

    # 2. 设置 Go 环境
    - name: Set up Go
      uses: setup-go@v5
      with:
        go-version: '1.22'

    # 3. 编译 Go 监控程序
    # 注意：根据你解压后的实际目录层级调整 working-directory（如果 Monitor-main 是根目录）
    - name: Build binary
      working-directory: ./Monitor-main/monitor
      run: |
        go mod tidy
        go build -v -o monitor-app main.go

    # 4. 保存编译好的二进制文件（可在 GitHub Actions 页面下载）
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: monitor-binary
        path: ./Monitor-main/monitor/monitor-app
